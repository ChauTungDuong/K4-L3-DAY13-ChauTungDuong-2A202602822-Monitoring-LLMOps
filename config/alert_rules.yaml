alerts:
  - name: HighLatencyP95
    severity: warning
    condition: "p95(latency_ms) > 3000ms sustained"
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: "#k4-l3b-alerts"
    owner: student-2A202602822
    runbook: docs/alerts.md#alert-1

  - name: HighErrorRate
    severity: critical
    condition: "error_rate_pct > 2% over last 5 minutes"
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: "#k4-l3b-alerts"
    owner: student-2A202602822
    runbook: docs/alerts.md#alert-2

  - name: LowRetrievalSuccessRate
    severity: warning
    condition: "retrieval_success_rate_pct < 90% over last 10 minutes"
    duration: 10m
    type: symptom-based
    channel: slack
    slack_channel: "#k4-l3b-alerts"
    owner: student-2A202602822
    runbook: docs/alerts.md#alert-3
