service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  error_budget_explanation: |
    Với baseline ~10 request/phút trong phiên lab (khoảng 2400 request/4 giờ),
    quy mô ra 28 ngày ≈ 403,200 request.
    Error budget 0.5% = tối đa 2,016 request được phép không đạt SLO (latency_ms > 3000ms hoặc lỗi).
    Baseline thực tế: P95 latency ≈ 400ms, error rate ≈ 0% → còn nhiều error budget.
    SLO 99.5% được chọn vì API là internal chatbot; latency 3000ms là ngưỡng người dùng bắt đầu nhận thấy.
  baseline_p50_ms: 390
  baseline_p95_ms: 410
  baseline_p99_ms: 2500
  baseline_error_rate_pct: 0
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
